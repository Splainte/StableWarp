<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>StableWarp</title>
<style>
  html, body { height:100%; }
  body { background:#1d1d1d; color:#d6d6d6; font:12px/1.5 -apple-system, "Segoe UI", sans-serif;
         margin:0; padding:14px; box-sizing:border-box; display:flex; flex-direction:column; }
  h1 { font-size:15px; margin:0; color:#fff; }
  .sub { color:#888; margin:2px 0 14px; font-size:11px; }
  #stabBtn { display:block; width:100%; padding:12px; font-size:14px; font-weight:bold;
             background:#2d6cdf; color:#fff; border:none; border-radius:6px; cursor:pointer; }
  #stabBtn:hover { background:#3b7af0; }
  #stabBtn:disabled { background:#444; color:#999; cursor:default; }
  #unstabBtn, #reanBtn { display:block; width:100%; margin-top:8px; padding:7px; font-size:11px;
               background:transparent; color:#999; border:1px solid #4a4a4a;
               border-radius:6px; cursor:pointer; }
  #unstabBtn:hover, #reanBtn:hover { color:#ddd; border-color:#666; }
  #diagBtn, #capBtn, #apiBtn { display:block; width:100%; margin-top:8px; padding:7px; font-size:11px;
             background:transparent; color:#c8a24a; border:1px dashed #6a5a2a;
             border-radius:6px; cursor:pointer; }
  #diagBtn:hover, #capBtn:hover, #apiBtn:hover { color:#e0bc63; border-color:#8a7333; }
  .row { display:flex; align-items:center; gap:8px; margin-top:12px; }
  .row label { color:#aaa; flex:1; }
  input[type="checkbox"] { accent-color:#2d6cdf; }
  .state { font-size:11px; color:#6da56d; }
  .state.off { color:#a05c5c; }
  #log { background:#1b1b1b; border:1px solid #3a3a3a; border-radius:4px; padding:8px;
         margin-top:14px; flex:1; min-height:100px; overflow-y:auto; white-space:pre-wrap;
         font-family:Consolas, Menlo, monospace; font-size:11px; }
  .ok { color:#7fd17f; } .err { color:#ff8a8a; } .info { color:#7cb8ff; } .dim { color:#777; }
  .footer { display:flex; justify-content:space-between; align-items:center;
            margin-top:8px; font-size:10px; color:#666; }
  #updateBtn { background:transparent; color:#888; border:1px solid #4a4a4a;
               border-radius:4px; padding:3px 8px; font-size:10px; cursor:pointer; }
  #updateBtn:hover { color:#ccc; border-color:#666; }
  #updateBtn:disabled { color:#666; cursor:default; }
  #updateBtn.available { background:#3a5a3a; color:#bfe8bf; border-color:#4f7a4f; }
  #updateBtn.available:hover { background:#456b45; }
</style>
</head>
<body>
  <h1>StableWarp</h1>
  <div class="sub">Stabilisez vos ralentis/accélérés sans prise de tête</div>

  <button id="stabBtn" onclick="stabilize()">Stabiliser la sélection</button>
  <button id="unstabBtn" onclick="unstabilize()">Dé-stabiliser (restaurer le rush d'origine)</button>
  <button id="reanBtn" onclick="reanalyze()">Relancer l'analyse de la sélection</button>
  <button id="diagBtn" onclick="diag()">🔬 Diagnostic bandeau (build test)</button>
  <button id="capBtn" onclick="capture()">📷 Capture image (build test)</button>
  <button id="apiBtn" onclick="testApi()">🧪 Test API analyse (build test)</button>

  <div class="row">
    <label for="watch">Re-stab auto si les in/out bougent (recommandé)</label>
    <input id="watch" type="checkbox" checked onchange="updateWatcher()">
    <span id="watchState" class="state">active</span>
  </div>

  <div class="row">
    <label for="banner">Détecteur de bandeau bleu — relance l'analyse (recommandé)</label>
    <input id="banner" type="checkbox" checked onchange="updateWatcher()">
    <span id="bannerState" class="state">active</span>
  </div>

  <div id="log"></div>

  <div class="footer">
    <span id="version"></span>
    <button id="updateBtn" onclick="checkUpdate()">Vérifier les mises à jour</button>
  </div>

<script>
  var SW_VERSION = '1.1.3-test8';
  var SW_REPO = 'Splainte/StableWarp';

  var logEl = document.getElementById('log');
  var watchTimer = null;
  var busy = false;
  var updateUrl = null;
  var updating = false;

  document.getElementById('version').textContent = 'v' + SW_VERSION;

  function log(msg, cls) {
    if (!msg) return;
    var lines = String(msg).split('\n');
    for (var i = 0; i < lines.length; i++) {
      var line = document.createElement('div');
      line.className = cls || (lines[i].indexOf('ECHEC') >= 0 ? 'err' : 'ok');
      line.textContent = lines[i];
      logEl.appendChild(line);
    }
    while (logEl.childNodes.length > 300) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function evalJSX(call, cb) {
    window.__adobe_cep__.evalScript(call, cb);
  }

  function stabilize() {
    if (busy) return;
    busy = true;
    var btn = document.getElementById('stabBtn');
    btn.disabled = true;
    btn.textContent = 'Stabilisation…';
    log('▶ Stabilisation de la sélection', 'info');
    evalJSX('SW_stabilizeSelection()', function (res) {
      log(res === 'EvalScript error.' ? 'ECHEC erreur ExtendScript' : res);
      btn.disabled = false;
      btn.textContent = 'Stabiliser la sélection';
      busy = false;
    });
  }

  function unstabilize() {
    if (busy) return;
    busy = true;
    log('▶ Dé-stabilisation de la sélection', 'info');
    evalJSX('SW_unstabilizeSelection()', function (res) {
      log(res === 'EvalScript error.' ? 'ECHEC erreur ExtendScript' : res);
      busy = false;
    });
  }

  function reanalyze() {
    if (busy) return;
    busy = true;
    log('▶ Relance de l’analyse de la sélection', 'info');
    evalJSX('SW_reanalyzeSelection()', function (res) {
      log(res === 'EvalScript error.' ? 'ECHEC erreur ExtendScript' : res);
      busy = false;
    });
  }

  function testApi() {
    if (busy) return;
    log('▶ Test API analyse (lecture seule)', 'info');
    evalJSX('SW_testAnalysisApi()', function (res) {
      log(res === 'EvalScript error.' ? 'ECHEC erreur ExtendScript' : res, 'dim');
    });
  }

  // TEST : exporte une image de chaque clip sélectionné sur le Bureau, puis vérifie
  // quels fichiers ont été écrits (l'export peut être différé, et Premiere ajoute
  // parfois lui-même l'extension .png)
  function capture() {
    if (busy) return;
    var os = require('os'), path = require('path'), fs = require('fs');
    var dir = path.join(os.homedir(), 'Desktop');
    if (!fs.existsSync(dir)) dir = os.tmpdir();
    log('▶ Capture image (lecture seule, ne modifie rien)', 'info');
    evalJSX('SW_captureSelected(' + JSON.stringify(dir) + ', ' + JSON.stringify(path.sep) + ')', function (res) {
      if (res === 'EvalScript error.') { log('ECHEC erreur ExtendScript'); return; }
      var lines = String(res).split('\n'), files = [];
      for (var i = 0; i < lines.length; i++) {
        var p = lines[i].split('|');
        if (p[0] === 'FILE') files.push({ base: p[1], label: p[2] });
        else log(lines[i], 'dim');
      }
      setTimeout(function () {
        for (var j = 0; j < files.length; j++) {
          var f = files[j], found = null;
          var cands = [f.base + '.png', f.base];
          for (var c = 0; c < cands.length; c++) if (fs.existsSync(cands[c])) { found = cands[c]; break; }
          log((found ? '📄 ' + found : 'ECHEC image non trouvée pour') + ' — ' + f.label, found ? 'info' : undefined);
        }
        if (files.length) log('Envoie ces images à Claude (une avec bandeau, une sans si possible).', 'info');
      }, 3000);
    });
  }

  // écrit le diagnostic dans un .txt facile à retrouver ; renvoie le chemin ou null
  function _writeDiag(text) {
    var os = require('os'), path = require('path'), fs = require('fs');
    var targets = [path.join(os.homedir(), 'Desktop', 'stablewarp-diag.txt'),
                   path.join(os.tmpdir(), 'stablewarp-diag.txt')];
    for (var i = 0; i < targets.length; i++) {
      try { fs.writeFileSync(targets[i], text, 'utf8'); return targets[i]; } catch (e) {}
    }
    return null;
  }

  function diag() {
    if (busy) return;
    log('▶ Diagnostic bandeau (lecture seule, ne modifie rien)', 'info');
    evalJSX('SW_diagWarp()', function (res) {
      var out = res === 'EvalScript error.' ? 'ECHEC erreur ExtendScript' : res;
      log(out, 'dim');
      var f = _writeDiag(out);
      if (f) log('📄 Diagnostic enregistré : ' + f + ' — envoie ce fichier à Robin/Claude.', 'info');
      else log('(fichier non écrit — copie le texte ci-dessus à la main)', 'dim');
    });
  }

  function watchTick() {
    if (busy) return;
    if (document.getElementById('watch').checked) {
      evalJSX('SW_watchTick()', function (res) {
        if (res && res !== 'EvalScript error.') log(res); // ECHEC en rouge ligne par ligne
      });
    }
    if (document.getElementById('banner').checked) bannerTick();
  }

  // ---- détecteur de bandeau bleu ----
  // Le JSX lit la barre de rendu et relance lui-même les analyses ; il ne demande une
  // capture d'image que pour trancher un clip resté rouge après sa ré-analyse. Ici on
  // attend alors le fichier, on y cherche la bande bleue et on renvoie le verdict.

  var bannerJob = false;

  function bannerTick() {
    if (bannerJob) return;
    var os = require('os'), path = require('path'), fs = require('fs');
    var dir = path.join(os.tmpdir(), 'stablewarp');
    try { if (!fs.existsSync(dir)) fs.mkdirSync(dir); } catch (e) { return; }
    bannerJob = true;
    evalJSX('SW_bannerNext(' + JSON.stringify(dir) + ', ' + JSON.stringify(path.sep) + ')', function (res) {
      if (!res || res === 'EvalScript error.') { bannerJob = false; return; }
      var lines = String(res).split('\n'), cap = null;
      for (var i = 0; i < lines.length; i++) {
        if (lines[i].indexOf('CAPTURE|') === 0) cap = lines[i].substr(8);
        else log(lines[i]);
      }
      if (!cap) { bannerJob = false; return; }
      waitForPng(cap, function (file) {
        if (!file) { bannerVerdict(-1); return; }
        detectBand(file, function (v) {
          try { fs.unlinkSync(file); } catch (e) {}
          bannerVerdict(v);
        });
      });
    });
  }

  function bannerVerdict(v) {
    evalJSX('SW_bannerResult(' + v + ')', function (msg) {
      if (msg && msg !== 'EvalScript error.') log(msg);
      bannerJob = false;
    });
  }

  // L'export est différé et Premiere ajoute parfois lui-même « .png » : on attend qu'un
  // des deux fichiers existe et que sa taille ne bouge plus (15 s max).
  function waitForPng(base, cb) {
    var fs = require('fs'), tries = 0, lastSize = -1;
    (function poll() {
      var cands = [base + '.png', base];
      for (var i = 0; i < cands.length; i++) {
        try {
          var size = fs.statSync(cands[i]).size;
          if (size > 0 && size === lastSize) { cb(cands[i]); return; }
          lastSize = size;
          break;
        } catch (e) {}
      }
      if (++tries > 37) { cb(null); return; }
      setTimeout(poll, 400);
    })();
  }

  // 1 = bandeau, 0 = rien, -1 = image illisible
  function detectBand(file, cb) {
    var img = new Image();
    img.onload = function () {
      try {
        var W = 384, H = Math.max(1, Math.round(W * img.height / img.width));
        var cv = document.createElement('canvas');
        cv.width = W; cv.height = H;
        var cx = cv.getContext('2d');
        cx.drawImage(img, 0, 0, W, H);
        cb(hasBanner(cx.getImageData(0, 0, W, H).data, W, H));
      } catch (e) { cb(-1); }
    };
    img.onerror = function () { cb(-1); };
    try { img.src = 'data:image/png;base64,' + require('fs').readFileSync(file).toString('base64'); }
    catch (e) { cb(-1); }
  }

  // Bande bleue pleine largeur (bandeau d'analyse du Warp) : sur les bords gauche et
  // droit (le texte est centré), une suite de lignes presque entièrement « bleu pur »,
  // de 1,5 à 12 % de la hauteur, centrée verticalement (35-65 %). Seuils réglés sur une
  // vraie capture : le bandeau est semi-transparent, de (4,54,210) sur fond noir à
  // (32,86,255) sur fond clair.
  function hasBanner(d, W, H) {
    var best = 0, bestStart = 0, run = 0;
    for (var y = 0; y < H; y++) {
      var n = 0, tot = 0;
      for (var x = 0; x < W; x++) {
        if (x >= W * 0.2 && x < W * 0.8) continue;
        var i = (y * W + x) * 4, r = d[i], g = d[i + 1], b = d[i + 2];
        tot++;
        if (b >= 160 && r <= 80 && g <= 140 && b - g >= 80 && b - r >= 120) n++;
      }
      run = (n / tot > 0.9) ? run + 1 : 0;
      if (run > best) { best = run; bestStart = y - run + 1; }
    }
    var h = best / H, c = (bestStart + best / 2) / H;
    return (h >= 0.015 && h <= 0.12 && c >= 0.35 && c <= 0.65) ? 1 : 0;
  }

  function _setState(id, on) {
    var el = document.getElementById(id);
    el.textContent = on ? 'active' : 'coupée';
    el.className = on ? 'state' : 'state off';
  }

  function updateWatcher() {
    var restab = document.getElementById('watch').checked;
    var banner = document.getElementById('banner').checked;
    _setState('watchState', restab);
    _setState('bannerState', banner);
    if (watchTimer) { clearInterval(watchTimer); watchTimer = null; }
    if (restab || banner) watchTimer = setInterval(watchTick, 2500);
  }

  // ---- mise à jour (GitHub Releases, même principe que Sauron) ----

  function newerThan(remote, local) {
    var r = remote.split('.'), l = local.split('.');
    for (var i = 0; i < Math.max(r.length, l.length); i++) {
      var a = parseInt(r[i] || '0', 10), b = parseInt(l[i] || '0', 10);
      if (a !== b) return a > b;
    }
    return false;
  }

  // récupère la dernière release publiée (silencieux si repo privé / sans release)
  function fetchLatest(cb) {
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://api.github.com/repos/' + SW_REPO + '/releases/latest', true);
      xhr.onload = function () {
        if (xhr.status !== 200) { cb('HTTP ' + xhr.status); return; }
        try { cb(null, JSON.parse(xhr.responseText)); } catch (e) { cb(String(e)); }
      };
      xhr.onerror = function () { cb('réseau indisponible'); };
      xhr.send();
    } catch (e) { cb(String(e)); }
  }

  // mémorise l'URL de l'asset setup*.exe (repli : page de la release)
  function pickAsset(rel) {
    var assets = rel.assets || [];
    updateUrl = rel.html_url;
    for (var i = 0; i < assets.length; i++) {
      if (/setup.*\.exe$/i.test(assets[i].name)) { updateUrl = assets[i].browser_download_url; break; }
    }
  }

  // au démarrage : vérif silencieuse, met juste le bouton en avant si MàJ dispo
  function autoCheck() {
    fetchLatest(function (err, rel) {
      if (err) return;
      var tag = (rel.tag_name || '').replace(/^v/, '');
      if (tag && newerThan(tag, SW_VERSION)) {
        pickAsset(rel);
        var btn = document.getElementById('updateBtn');
        btn.textContent = 'Mise à jour v' + tag + ' disponible';
        btn.classList.add('available');
      }
    });
  }

  // clic sur le bouton : vérifie, et installe si une version plus récente existe
  function checkUpdate() {
    if (updating) return;
    updating = true;
    var btn = document.getElementById('updateBtn');
    btn.disabled = true;
    log('Recherche de mise à jour…', 'info');
    fetchLatest(function (err, rel) {
      if (err) { log('ECHEC vérification : ' + err); updating = false; btn.disabled = false; return; }
      var tag = (rel.tag_name || '').replace(/^v/, '');
      if (!tag || !newerThan(tag, SW_VERSION)) {
        log('StableWarp est à jour (v' + SW_VERSION + ').', 'info');
        updating = false; btn.disabled = false; return;
      }
      log('Nouvelle version disponible : v' + tag, 'info');
      pickAsset(rel);
      installUpdate(tag, btn);
    });
  }

  // suit les redirections (GitHub Releases → S3) puis écrit le fichier sur disque
  function httpsDownload(url, dest, cb) {
    var https = require('https');
    var fs = require('fs');
    https.get(url, { headers: { 'User-Agent': 'StableWarp' } }, function (res) {
      if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
        return httpsDownload(res.headers.location, dest, cb);
      }
      if (res.statusCode !== 200) { cb('HTTP ' + res.statusCode); return; }
      var out = fs.createWriteStream(dest);
      res.pipe(out);
      out.on('finish', function () { out.close(function () { cb(null); }); });
      out.on('error', function (e) { cb(String(e)); });
    }).on('error', function (e) { cb(String(e)); });
  }

  // télécharge l'installeur et le lance (Windows), ou relance le script d'install (macOS)
  function installUpdate(tag, btn) {
    try {
      var os = require('os'), path = require('path'), cp = require('child_process');
      if (process.platform === 'win32') {
        if (!updateUrl) { log('ECHEC : pas d’installeur dans la release'); updating = false; btn.disabled = false; return; }
        var dest = path.join(os.tmpdir(), 'StableWarp-Setup-v' + tag + '.exe');
        log('Téléchargement de l’installeur…', 'info');
        httpsDownload(updateUrl, dest, function (err) {
          if (err) { log('ECHEC téléchargement : ' + err); updating = false; btn.disabled = false; return; }
          // .exe détaché direct => « spawn UNKNOWN » avec le Node de CEP ; passer par cmd /c start
          cp.spawn('cmd.exe', ['/c', 'start', '', dest], { detached: true, stdio: 'ignore', windowsHide: true }).unref();
          log('Installeur lancé : suis l’assistant, puis redémarre Premiere.', 'info');
          updating = false; btn.disabled = false;
        });
      } else {
        var sh = path.join(os.tmpdir(), 'stablewarp-install.sh');
        log('Téléchargement du programme d’installation…', 'info');
        httpsDownload('https://raw.githubusercontent.com/' + SW_REPO + '/main/install/install-macos.sh', sh, function (err) {
          if (err) { log('ECHEC téléchargement : ' + err); updating = false; btn.disabled = false; return; }
          cp.spawn('/bin/bash', [sh], { detached: true, stdio: 'ignore' }).unref();
          log('Mise à jour en cours — patiente, puis redémarre Premiere.', 'info');
          updating = false; btn.disabled = false;
        });
      }
    } catch (e) {
      log('ECHEC mise à jour : ' + e);
      updating = false; btn.disabled = false;
    }
  }

  evalJSX('SW_env()', function (res) { log(res, 'dim'); });
  updateWatcher();
  autoCheck();
</script>
</body>
</html>
